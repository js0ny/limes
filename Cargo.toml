[package]
name = "limes"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
zbus = { version = "5", features = ["tokio"] }
